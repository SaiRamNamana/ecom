<div class="container mx-auto p-6">
    <h2 class="text-2xl font-semibold mb-4"><fa-icon [icon]="arrowLeft" class="mr-2 text-md cursor-pointer"
            routerLink="/"></fa-icon>Your Order History</h2>

    <div class="p-8">
        <div class="col-span-full flex flex-col items-center justify-center min-h-[50vh] text-center p-6 rounded-lg"
            *ngIf="this.orderHistory.length === 0">
            <h1 class="text-2xl font-semibold text-gray-600 mt-4">There is no order history</h1>
        </div>

        <div *ngIf="orderHistory.length > 0" class="border border-gray-200 rounded-lg">
            <div class="overflow-y-auto max-h-[70vh] custom-scrollbar">
                <table class="w-full border border-gray-200 rounded-lg table-auto">
                    <thead class="bg-gray-100 sticky top-0 z-10 shadow-md">
                        <tr>
                            <th class="px-6 py-3 text-left text-sm font-medium text-gray-600 uppercase">Date</th>
                            <th class="px-6 py-3 text-left text-sm font-medium text-gray-600 uppercase">Total</th>
                            <th class="px-6 py-3 text-left text-sm font-medium text-gray-600 uppercase">Items</th>
                            <th class="px-6 py-3 text-left text-sm font-medium text-gray-600 uppercase">Invoice</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr *ngFor="let order of orderHistory" class="hover:bg-gray-50 transition">
                            <td class="px-6 py-4 whitespace-normal text-gray-700">{{ order.orderdate | date }}</td>
                            <td class="px-6 py-4 whitespace-normal text-gray-700">${{ order.total }}</td>
                            <td class="px-6 py-4 whitespace-normal">
                                <ul class="list-inside list-none text-gray-700">
                                    <li *ngFor="let item of order.items">{{ item.productName }} (Qty: {{ item.quantity
                                        }})</li>
                                </ul>
                            </td>
                            <td class="px-6 py-4 whitespace-normal text-gray-700"><button
                                    class="bg-blue-500 p-2 font-bold text-white rounded-3xl hover:opacity-80 cursor-pointer"
                                    (click)="invoiceOfOrder(order)">Invoice</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
