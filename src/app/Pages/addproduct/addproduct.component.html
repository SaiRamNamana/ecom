<div class="container mx-auto p-6">
    <h2 class="text-2xl font-semibold mb-4"><fa-icon [icon]="arrowLeft" class="mr-2 text-md cursor-pointer" (click)="back()"></fa-icon></h2>
  
<div class="max-w-xl mx-auto bg-slate-100 shadow-md rounded-xl p-6">
    <h2 class="text-xl font-bold text-center mb-4">{{isEditing ? 'Update Product' : 'Add New Product'}}</h2>

    <form [formGroup]="addProductForm" (ngSubmit)="saveProduct()" class="flex flex-col gap-4">

        
        <div>
            <label class="block text-sm font-medium mb-1">Title</label>
            <input type="text" formControlName="title" class="w-full border px-3 py-2 rounded-md">
            <p class="text-red-500 text-xs mt-1"
                *ngIf="addProductForm.get('title')?.invalid && addProductForm.controls['title'].touched">
                Title is required (min 3 characters).
            </p>
        </div>

       
        <div>
            <label class="block text-sm font-medium mb-1">Image URL</label>
            <input type="text" formControlName="image" class="w-full border px-3 py-2 rounded-md">
            <p class="text-red-500 text-xs mt-1"
                *ngIf="addProductForm.controls['image'].invalid && addProductForm.controls['image'].touched">
                Enter a valid image URL.
            </p>
        </div>

       
        <div>
            <label class="block text-sm font-medium mb-1">Price ($)</label>
            <input type="number" formControlName="price" class="w-full border px-3 py-2 rounded-md">
            <p class="text-red-500 text-xs mt-1"
                *ngIf="addProductForm.controls['price'].invalid && addProductForm.controls['price'].touched">
                Price must be greater than 0.
            </p>
        </div>

        
        <div>
            <label class="block text-sm font-medium mb-1">Description</label>
            <textarea formControlName="description" 
                class="w-full border px-3 py-2 rounded-md resize-none h-24"
                placeholder="Enter product description..."
            ></textarea>
        
            <p class="text-red-500 text-xs mt-1"
                *ngIf="addProductForm?.get('description')?.invalid && addProductForm?.get('description')?.touched">
                Describe about the product (required).
            </p>
        </div>
        

        
        <div>
            <label class="block text-sm font-medium mb-1">Stock</label>
            <input type="number" formControlName="stock" class="w-full border px-3 py-2 rounded-md">
            <p class="text-red-500 text-xs mt-1"
                *ngIf="addProductForm.controls['stock'].invalid && addProductForm.controls['stock'].touched">
                Stock must be greater than 0.
            </p>
        </div>
        <div *ngIf="!isEditing">
            <label class="block text-sm font-medium mb-1">Category</label>
            <select formControlName="categoryId" class="w-full border px-3 py-2 rounded-md"  (change)="checkNewCategory($event)">
                <option *ngFor="let category of categories" [value]="category.id">
                    {{ category.name }}  <fa-icon [icon]="faDelete" ></fa-icon>
                </option>
                <option value="new">+ Add New Category</option>
            </select>
            <p class="text-red-500 text-xs mt-1"
            *ngIf="addProductForm.controls['categoryId'].invalid && addProductForm.controls['categoryId'].touched">
            Please select a category.
            </p>
            <div *ngIf="isAddingNewCategory" class="mt-2">
                <input formControlName="newCategory" placeholder="Enter new category" type="text"
                    class="w-full border px-3 py-2 rounded-md" />
                <p class="text-red-500 text-xs mt-1"
                    *ngIf="categoryExists">
                    Category already exists.
                </p>
                <p class="text-red-500 text-xs mt-1"
                    *ngIf="addProductForm.controls['newCategory'].invalid">
                    Must be a valid category.
                </p>
                <button (click)="addNewCategory()" class="bg-blue-500 text-white px-4 py-2 rounded-md mt-2" [disabled]="addProductForm.controls['newCategory'].invalid">
                    Save Category
                </button>
            </div>
        </div>

       
          
          <button type="submit" 
            [disabled]="addProductForm.invalid"
            class="w-full bg-blue-500 text-white px-6 py-2 rounded-md disabled:opacity-50 hover:bg-blue-600"
            (click)="btnClicked.emit()">
            {{ isEditing ? 'Update Product' : 'Add Product' }}
          </button>
          
    </form>
</div>
