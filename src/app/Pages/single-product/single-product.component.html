<div class="container mx-auto p-6">
    <h2 class="text-2xl font-semibold mb-4"><fa-icon [icon]="arrowLeft" class="mr-2 text-md cursor-pointer" (click)="navigateToHome()"></fa-icon></h2>
  
<div class="h-[80vh] flex items-center justify-center p-10" *ngIf="product">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-6xl w-full">
        <div class="flex items-center justify-center">
            <img [src]="product?.image" class="w-[25rem] h-auto object-contain rounded-lg shadow-md"
                [alt]="product?.title || 'Product image'">
        </div>

        <div class="flex flex-col justify-center">
            <div class="flex flex-row justify-end">
                <div><fa-icon [icon]="faHeart" (click)="addToWishlist(product)" [ngStyle]="{
                'color': wishlistOfUser.indexOf(product.id) !== -1 ? 'red' : 'black',
            }" class="cursor-pointer text-2xl"></fa-icon></div>
            </div>
            <h1 class="text-3xl font-bold mb-3">{{ product?.title }}</h1>

            <p class="text-xl font-semibold text-gray-700 mb-2">
                ${{ product?.price }}
            </p>

            <p class="text-md text-gray-600 mb-5">
                {{ product?.description }}
            </p>

            <span class="text-sm font-bold mb-3" [class]="product?.stock ? 'text-green-500' : 'text-red-500'">
                @if (product?.stock !== 0) {
                {{ product?.stock }} left
                } @else {
                Out of stock
                }
            </span>
            <div class="flex flex-row justify-end">
                <app-primary-button [label]="cartItems.indexOf(product.id) !== -1 ? 'In Cart':'Add to Cart'" class="mt-3" (btnClicked)="addingProduct(product)"
                [disabled]="cartItems.indexOf(product.id) !== -1 || product?.stock == 0">
                </app-primary-button>
            </div>
        </div>
    </div>
</div>
