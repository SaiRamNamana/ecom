<div class="bg-slate-100 p-6 rounded-xl shadow-xl border m-7 flex flex-col custom">
    <h2 class="text-xl">Order Summary</h2>
    <div class="flex flex-col gap-4 w-full custom">
        <div class="flex flex-col w-full custom">
            <span class="text-lg">Total</span>
            <span class="text-lg font-bold">{{ total() | currency:'USD' }}</span>
        </div>
        <app-primary-button label="Proceed to checkout" (btnClicked)="orderConfirm()"></app-primary-button>
    </div>
</div>
