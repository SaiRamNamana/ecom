<div class="bg-white shadow-lg rounded-xl p-6 flex items-center gap-6 relative border border-gray-200">

    <div class="w-[4.375rem] h-[4.375rem] flex justify-center items-center bg-gray-100 rounded-lg shadow">
        <img [src]="item().image" class="w-full h-full object-contain rounded-md" [alt]="item().title">
    </div>

    <div class="flex flex-col flex-grow">
        <span class="text-lg font-semibold text-gray-800">{{ item().title }}</span>
        <span class="text-md text-gray-600">{{ '$' + item().price }}</span>
    </div>

    <div class="flex items-center bg-gray-100 px-3 py-1 rounded-md shadow">
        <fa-icon [icon]="faMinus" class="cursor-pointer text-gray-500 hover:text-black transition" (click)="decrement(item())"></fa-icon>
        <div class="text-lg font-semibold mx-4">{{ item().quantity }}</div>
        <fa-icon [icon]="faPlus" class="cursor-pointer text-gray-500 hover:text-black transition" (click)="addingProduct(item())"></fa-icon>
    </div>

    <app-button 
        label="Remove" 
        (btnClicked)="removeFromCart(item())">
    </app-button>

</div>
