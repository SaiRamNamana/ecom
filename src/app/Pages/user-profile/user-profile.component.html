<div class="container mx-auto p-6">
    <button class="bg-blue-500 rounded-xl cursor-pointer font-bold p-1 text-white hover:opacity-90" (click)="back()"><fa-icon [icon]="arrowLeft" class="mr-2 text-md cursor-pointer"></fa-icon></button>
    <h1 class="font-bold text-xl text-center mb-6">User Profile</h1>

    <div class="min-h-screen w-auto container px-4 py-6 mt-10">
        <div class="flex flex-col md:flex-row items-center justify-around gap-8 bg-white p-6 rounded-lg">

            <div class="w-full md:w-1/2 flex justify-center">
                <div class="max-w-xs">
                    <img [src]="imageUrl ? imageUrl :'src/assets/images/profile.jpg'" alt="Profile Image" class="w-40 h-40 sm:w-60 sm:h-60 md:w-72 md:h-72 
                                rounded-full shadow-lg object-cover" />
                </div>
            </div>

            <div class="w-full md:w-1/2 flex justify-center">
                <form [formGroup]="changeProfile" (ngSubmit)="saveProfile()">
                    <div class="max-w-sm w-full space-y-4">

                        <div class="flex flex-col space-y-2">
                            <label for="username" class="text-sm font-medium">Username</label>
                            <input type="text" id="username" formControlName="userName"
                                placeholder="Enter your username"
                                class="border-0 border-b-2 border-gray-200 px-3 py-2 focus:outline-none" required />
                            <p *ngIf="changeProfile.get('userName')?.invalid && changeProfile.get('userName')?.touched"
                                class="text-red-500 text-xs mt-1">
                                Username is required.
                            </p>
                            <p *ngIf="changeProfile.get('userName')?.errors?.['maxlength']"
                                class="text-red-500 text-xs mt-1">
                                Maximum length exceeded (Max 10 characters).
                            </p>
                        </div>

                        <div class="flex flex-col space-y-2">
                            <label for="profileImage" class="text-sm font-medium">Profile Image</label>
                            <input type="file" id="profileImage" accept="image/*" class="file:bg-blue-500 file:text-white file:px-4 file:py-2 
                                      file:rounded-lg file:border-none 
                                      hover:file:bg-blue-600 cursor-pointer
                                      border border-gray-300 rounded-lg px-3 py-2 w-full" formControlName="file"
                                (change)="onFileSelected($event)" />
                        </div>

                        <button type="submit" [disabled]="changeProfile.invalid" class="bg-blue-500 text-white w-full py-2 rounded-lg 
                                   hover:bg-blue-600 transition duration-300">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
