<div class=" gap-4 sticky top-17 z-40">
  <div class="p-1 bg-blue-200">
    <div class="flex flex-row justify-left m-2 h-10 z-40 gap-4">
      <div *ngFor="let category of categories" class="p-1 cursor-pointer"
        [ngClass]="{'border-b-2 border-blue-500 font-bold': activeCategory === category}" (click)="retrive(category)">
        {{ category }}
      </div>
    </div>
  </div>
  <div class="bg-white flex flex-col p-3 sm:flex-row sm:justify-end items-center gap-4 sticky z-40">
    <div class="flex items-center gap-4">
      <button class="flex flex-col items-center gap p-2 w-9 hover:bg-gray-200 transition rounded-full"
        (click)="dropDownMenu  = !dropDownMenu">
        <fa-icon class="text-lg" [icon]="faSort" *ngIf="!dropDownMenu"></fa-icon> <fa-icon class="text-lg" [icon]="faCross" *ngIf="dropDownMenu"></fa-icon>
      </button>
      <div *ngIf="dropDownMenu" class="absolute right-[18%] mt-2 ml-1 w-48 bg-white border rounded-lg shadow-lg top-12">
        <ul class="py-2">
          <li  (click)="sortProducts('nameAsc')" *ngIf="isNameAsc">
            <button class="flex items-center w-full px-4 py-2 hover:bg-gray-100 relative" style="gap:  0.625rem;">
              Name:  <fa-icon class="text-sm" [icon]="faArrowUp"></fa-icon>
            </button>
          </li>

          <li class="relative"  (click)="sortProducts('name')" *ngIf="!isNameAsc">
            <button class="flex items-center w-full px-4 py-2 hover:bg-gray-100 relative" style="gap: 0.625rem;">
              Name: <fa-icon class="text-sm" [icon]="faArrowDown"></fa-icon>
            </button>
          </li>
          <li  (click)="sortProducts('priceAsc')" *ngIf="isPriceAsc">
            <button class="flex items-center w-full px-4 py-2 hover:bg-gray-100 relative" style="gap: 1.125rem;">
              Price: <fa-icon class="text-sm" [icon]="faArrowUp"></fa-icon>
            </button>
          </li>
          <li (click)="sortProducts('price')" *ngIf="!isPriceAsc">
            <button class="flex items-center w-full px-4 py-2 hover:bg-gray-100 relative" style="gap:  1.125rem;">
              Price:<fa-icon class="text-sm" [icon]="faArrowDown"></fa-icon>
            </button>
          </li>

        </ul>
      </div>
    </div>
    <div (click)="dropDownMenu ? dropDownMenu = !dropDownMenu : dropDownMenu"
        class="w-full sm:w-auto flex items-center gap-2 border border-gray-300 rounded-md p-2 shadow-sm focus-within:ring-2 focus-within:ring-blue-500 transition">
        <fa-icon [icon]="faSearch" class="text-gray-500"></fa-icon>
        <input type="text" [(ngModel)]="searchQuery" (input)="filterProducts()" placeholder="Search products..."
          class="w-full sm:w-64 p-1 outline-none bg-transparent" />
    </div>
  </div>
</div>
  <div class="p-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"
    [ngClass]="{'backdrop-blur-2xl pointer-events-none': showDeleteModal}">
    @if (products.length > 0) {
    @for (item of products; track item.id) {
    <app-product-card [product]="item" (deleteRequest)="handleDeleteRequest($event)"></app-product-card>
    }
    } @else {
    <div *ngIf="isLoading" class="fixed top-0 left-0 w-full h-full flex justify-center items-center z-50">
      <div class="w-12 h-12">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
          <circle fill="#23ABFF" stroke="#23ABFF" stroke-width="5" r="15" cx="40" cy="65">
            <animate attributeName="cy" calcMode="spline" dur="2" values="65;135;65;" keySplines=".5 0 .5 1;.5 0 .5 1"
              repeatCount="indefinite" begin="-.4"></animate>
          </circle>
          <circle fill="#23ABFF" stroke="#23ABFF" stroke-width="5" r="15" cx="100" cy="65">
            <animate attributeName="cy" calcMode="spline" dur="2" values="65;135;65;" keySplines=".5 0 .5 1;.5 0 .5 1"
              repeatCount="indefinite" begin="-.2"></animate>
          </circle>
          <circle fill="#23ABFF" stroke="#23ABFF" stroke-width="5" r="15" cx="160" cy="65">
            <animate attributeName="cy" calcMode="spline" dur="2" values="65;135;65;" keySplines=".5 0 .5 1;.5 0 .5 1"
              repeatCount="indefinite" begin="0"></animate>
          </circle>
        </svg>
      </div>
    </div>
    <div class="col-span-full flex flex-col items-center justify-center min-h-[18.75rem]text-center p-6 rounded-lg"
      *ngIf="!isLoading">
      <h1 class="text-2xl font-semibold text-gray-600 mt-4">No Product Found</h1>
      <p class="text-gray-500 mt-2">The product you are looking for does not exist.</p>
    </div>
    }
  </div>
  <div *ngIf="showDeleteModal" class="fixed inset-0 flex items-center justify-center z-50">
    <div class="absolute inset-0 bg-opacity-50"></div>

    <div class="relative bg-white p-6 rounded-lg shadow-lg w-96 z-50">
      <h2 class="text-lg font-semibold mb-4">Confirm Deletion</h2>
      <p>Are you sure you want to delete this product?</p>
      <p>{{this.selectedProduct.title}}</p>

      <div class="flex justify-end gap-4 mt-4">
        <button (click)="showDeleteModal = false" class="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">
          Cancel
        </button>
        <button (click)="confirmDelete()" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">
          Delete
        </button>
      </div>
    </div>
  </div>
